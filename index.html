<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chanthiran Mini HiFi System</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffaa00">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- HLS for Radio -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Orbitron:wght@600;800;900&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0c;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .music-player-container {
            width: 100%;
            min-height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
            background: linear-gradient(145deg, #22252a 0%, #111215 100%);
            border: 3px solid #3a3f47;
            border-radius: 12px;
            box-shadow: 0 0 35px rgba(0,0,0,0.9), inset 0 1px 2px rgba(255,255,255,0.15);
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: flex-start;
            align-items: center;
            position: relative;
        }

        .hifi-body-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .top-deck-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 24px;
            border-bottom: 2px solid #2e333d;
            padding-bottom: 6px;
        }

        .brand-label {
            font-family: 'Dancing Script', cursive;
            font-size: 1.7rem;
            color: #ffaa00;
            text-shadow: 0px 2px 10px rgba(255, 170, 0, 0.5);
            letter-spacing: 0.5px;
            user-select: none;
        }

        .top-right-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .compo-model-no {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            color: #6c757d;
            letter-spacing: 1.5px;
        }

        .exit-btn {
            background: linear-gradient(145deg, #ff3333, #990000);
            border: 1px solid #ff6666;
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 6px rgba(255, 0, 0, 0.4);
            transition: all 0.15s ease;
        }

        .exit-btn svg { width: 12px; height: 12px; fill: currentColor; }
        .exit-btn:active { transform: scale(0.92); }

        .compact-amp-panel {
            width: 100%;
            background: transparent !important;
            border: 1px dashed #454c59;
            border-radius: 6px;
            padding: 8px 12px;
            color: #fff;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .amp-knobs-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 4px 0;
        }

        .amp-knob-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .amp-knob-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem;
            font-weight: 800;
            color: #00e5ff;
            text-shadow: 0 0 6px rgba(0, 229, 255, 0.4);
        }

        .knob-3d {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: conic-gradient(
                #e2e8f0 0deg, #94a3b8 45deg, #cbd5e1 90deg, #64748b 135deg,
                #f1f5f9 180deg, #94a3b8 225deg, #cbd5e1 270deg, #475569 315deg, #e2e8f0 360deg
            );
            border: 2px solid #1e293b;
            box-shadow: 0 4px 8px rgba(0,0,0,0.8), inset 0 1px 3px rgba(255,255,255,0.9);
            position: relative;
            cursor: grab;
            user-select: none;
            touch-action: none;
            transform: rotate(0deg);
        }

        .knob-3d.large { width: 44px; height: 44px; transform: rotate(135deg); }
        .knob-3d::after {
            content: '';
            position: absolute;
            top: 3px; left: 50%;
            transform: translateX(-50%);
            width: 3px; height: 10px;
            background: #0f172a;
            border-radius: 2px;
        }
        .knob-3d.large::after { height: 14px; }

        .vu-meters-wrapper {
            width: 100%;
            display: flex;
            gap: 8px;
        }

        .vu-meter-unit {
            flex: 1;
            height: 50px;
            background: #11160a;
            border: 2px solid #2c3224;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .vu-meter-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 100%, rgba(255, 204, 0, 0.25) 0%, rgba(0,0,0,0.85) 75%);
        }

        .vu-needle {
            position: absolute;
            bottom: -5px;
            width: 2px;
            height: 45px;
            background: #ff3300;
            transform-origin: bottom center;
            transform: rotate(-42deg);
            transition: transform 0.06s ease-out;
            box-shadow: 0 0 4px #ff3300;
            z-index: 2;
        }

        .vu-scale {
            position: absolute;
            top: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem;
            color: #a3b899;
            width: 100%;
            text-align: center;
            letter-spacing: 2px;
            z-index: 1;
        }

        .visualizer-container {
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            border: 1px solid #2c323d;
            border-radius: 6px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        #visualizerCanvas {
            background: transparent !important;
            width: 100%;
            max-width: 420px;
            height: 100%;
        }

        .vfd-display-panel {
            width: 100%;
            background: #000;
            border: 2px solid #1c2628;
            border-radius: 6px;
            padding: 6px 12px;
            box-shadow: inset 0 0 15px rgba(0, 229, 255, 0.15), 0 0 8px rgba(0,0,0,0.8);
            text-align: center;
        }

        #nowPlayingSubtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            color: #ffaa00;
            margin: 0 0 2px 0;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #currentTrackTitle {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            margin: 0;
            color: #00e5ff;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.7);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cassette-deck-well {
            width: 100%;
            height: 110px;
            background: #0d0f12;
            border: 2px solid #323842;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cassette-deck-well svg.cdeck-svg { width: 100%; height: 100%; display: block; }

        .spool-overlay-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }

        .spool-left-wrapper { position: absolute; left: 23.5%; top: 42.5%; transform: translate(-50%, -50%); }
        .spool-right-wrapper { position: absolute; left: 51.5%; top: 42.5%; transform: translate(-50%, -50%); }

        .tape-wheel {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: #181c22;
            border: 3px solid #728096;
            box-shadow: 0 0 8px rgba(0,0,0,0.9);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .spoke-cross {
            position: absolute;
            width: 100%; height: 100%;
            top: 0; left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .spoke-bar-h, .spoke-bar-v { position: absolute; background: #e2e8f0; border-radius: 2px; }
        .spoke-bar-h { width: 24px; height: 5px; }
        .spoke-bar-v { width: 5px; height: 24px; }

        .tape-wheel.spinning { animation: spinWheel 2.5s linear infinite; }
        @keyframes spinWheel { 100% { transform: rotate(360deg); } }

        .fm-tuner-panel {
            width: 100%;
            background: linear-gradient(145deg, #14161a 0%, #0a0b0d 100%);
            border: 2px solid #2c323d;
            border-radius: 6px;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .fm-tuner-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.58rem;
            color: #ffaa00;
            letter-spacing: 1.5px;
            font-weight: 800;
            text-align: center;
        }

        .fm-buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            width: 100%;
        }

        .fm-preset-btn {
            background: linear-gradient(145deg, #2a2e38, #16181f);
            border: 1px solid #454c59;
            color: #00e5ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem;
            font-weight: 800;
            padding: 6px 2px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fm-preset-btn.active-fm { color: #111; background: linear-gradient(145deg, #ffaa00, #ff7700); border-color: #ffaa00; }
        .fm-preset-btn.off-btn { color: #ff6666; border-color: #ff3333; }

        .controls-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            background: #111;
            border: 1px solid #333;
            border-radius: 3px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 18px;
            width: 18px;
            background: linear-gradient(145deg, #e6e6e6, #888888);
            border: 1px solid #222;
            border-radius: 3px;
            margin-top: -6px;
        }

        #progressSlider { flex: 1; }
        .time-display { font-family: 'Orbitron', sans-serif; font-size: 0.7rem; color: #ffaa00; min-width: 36px; font-weight: 700; }

        .button-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 0 2px;
        }

        .music-button {
            cursor: pointer;
            border: 1px solid #454c59 !important;
            outline: none !important;
            padding: 0 !important;
            margin: 0;
            border-radius: 6px;
            color: #d1d5db;
            background: linear-gradient(145deg, #3a404d, #1f232b) !important;
            box-shadow: 0 4px 0 #111317;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 38px;
        }

        .music-button svg { width: 18px; height: 18px; fill: currentColor; }
        .music-button.active-mode { color: #ffaa00; border-color: #ffaa00 !important; }
        .pl-text { font-family: 'Orbitron', sans-serif; font-size: 0.8rem; font-weight: 800; }

        .dropdown { position: relative; display: inline-block; }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #181a1f;
            min-width: 260px;
            max-width: 80vw;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.9);
            z-index: 1000;
            right: 0;
            bottom: 100%;
            margin-bottom: 12px;
            border-radius: 8px;
            max-height: 40vh;
            overflow-y: auto;
            border: 2px solid #ffaa00;
        }
        .dropdown.show .dropdown-content { display: block; }
        .dropdown-content a, .dropdown-content label {
            color: #eee;
            padding: 10px 14px;
            text-decoration: none;
            display: block;
            font-size: 0.8rem;
            font-family: 'Orbitron', sans-serif;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            cursor: pointer;
        }
        .dropdown-content a.active { background-color: #353b47; color: #ffaa00; font-weight: bold; }

        .volume-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
            background: #181b20;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #2a2e38;
        }
        #volumeIcon { color: #ffaa00; }
        .boost-btn {
            background: linear-gradient(145deg, #3a404d, #1f232b);
            border: 1px solid #ffaa00;
            color: #ffaa00;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
        #volumeSlider { flex: 1; }
    </style>
</head>
<body>

<div class="music-player-container">
    <div class="top-deck-header">
        <div class="brand-label">Chanthiran</div>
        <div class="top-right-controls">
            <span class="compo-model-no">MINI HIFI SYSTEM</span>
            <button class="exit-btn" onclick="exitApp()" title="Exit App">
                <svg viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg>
                EXIT
            </button>
        </div>
    </div>

    <!-- PURE DIRECT AUDIO STREAM: 100% Native OS-level Background Rights -->
    <audio id="hifiAudio" preload="auto" playsinline></audio>

    <div class="hifi-body-wrapper">
        <div class="compact-amp-panel">
            <div class="amp-knobs-row">
                <div class="amp-knob-unit"><div id="bassKnob" class="knob-3d"></div><span class="amp-knob-label">BASS</span></div>
                <div class="amp-knob-unit"><div id="trebleKnob" class="knob-3d"></div><span class="amp-knob-label">TREBLE</span></div>
                <div class="amp-knob-unit"><div id="balanceKnob" class="knob-3d"></div><span class="amp-knob-label">BALANCE</span></div>
                <div class="amp-knob-unit"><div id="masterVolumeKnob" class="knob-3d large"></div><span class="amp-knob-label">VOLUME</span></div>
            </div>
        </div>

        <div class="vu-meters-wrapper">
            <div class="vu-meter-unit"><div class="vu-scale">VU L</div><div class="vu-meter-bg"></div><div id="vuNeedleL" class="vu-needle"></div></div>
            <div class="vu-meter-unit"><div class="vu-scale">VU R</div><div class="vu-meter-bg"></div><div id="vuNeedleR" class="vu-needle"></div></div>
        </div>

        <div class="visualizer-container">
            <canvas id="visualizerCanvas" width="380" height="50"></canvas>
        </div>

        <div class="vfd-display-panel">
            <p id="nowPlayingSubtitle">🎵 ♪ ♫ 🎶</p>
            <p id="currentTrackTitle">Kayu Ara - Mix hitz</p>
        </div>

        <div class="cassette-deck-well">
            <svg class="cdeck-svg" viewBox="0 0 400 120" preserveAspectRatio="none">
                <rect width="400" height="120" fill="#1e222a"/>
                <rect x="5" y="5" width="390" height="110" rx="6" fill="#13161c" stroke="#2e3542" stroke-width="2"/>
                <rect x="15" y="12" width="280" height="96" rx="5" fill="#090a0d" stroke="#3d4656" stroke-width="2"/>
                <rect x="305" y="12" width="80" height="96" rx="4" fill="#2d333f" stroke="#485265" stroke-width="1.5"/>
                <path d="M 25 20 L 285 20 L 280 98 L 30 98 Z" fill="#1a1e26" stroke="#2b313d" stroke-width="1"/>
                <rect x="50" y="30" width="210" height="42" rx="4" fill="#000000" stroke="#333c4a" stroke-width="2"/>
                <rect x="55" y="34" width="200" height="34" rx="2" fill="#251a14" opacity="0.8"/>
                <text x="32" y="32" fill="#718096" font-family="Orbitron, sans-serif" font-size="10" font-weight="800">90</text>
                <text x="230" y="32" fill="#e2e8f0" font-family="Orbitron, sans-serif" font-size="9" font-weight="900">TYPE I</text>
                <text x="32" y="50" fill="#ffaa00" font-family="Orbitron, sans-serif" font-size="11" font-weight="900">A</text>
            </svg>

            <div class="spool-overlay-container">
                <div class="spool-left-wrapper"><div id="tapeLeft" class="tape-wheel"><div class="spoke-cross"><div class="spoke-bar-h"></div><div class="spoke-bar-v"></div></div></div></div>
                <div class="spool-right-wrapper"><div id="tapeRight" class="tape-wheel"><div class="spoke-cross"><div class="spoke-bar-h"></div><div class="spoke-bar-v"></div></div></div></div>
            </div>
        </div>

        <div class="fm-tuner-panel">
            <div class="fm-tuner-label">FM STEREO TUNER PRESETS</div>
            <div class="fm-buttons-grid">
                <button class="fm-preset-btn" onclick="playFmStation('minnal', event)">MINNAL FM</button>
                <button class="fm-preset-btn" onclick="playFmStation('raaga', event)">THR RAAGA</button>
                <button class="fm-preset-btn" onclick="playFmStation('sooriyan', event)">SOORIYAN FM</button>
                <button class="fm-preset-btn" onclick="playFmStation('oli', event)">OLI 96.8</button>
                <button class="fm-preset-btn" onclick="playFmStation('airtamil80s', event)">80'S TAMIL</button>
                <button class="fm-preset-btn" onclick="playFmStation('ilayaraja', event)">ILAYARAJA</button>
                <button class="fm-preset-btn" onclick="playFmStation('arrahman', event)">AR RAHMAN</button>
                <button class="fm-preset-btn off-btn" onclick="turnOffRadio()">TAPE / PL</button>
            </div>
        </div>

        <div class="controls-wrapper">
            <div class="control-row">
                <span id="currentTime" class="time-display">0:00</span>
                <input type="range" id="progressSlider" min="0" max="0" value="0" />
                <span id="duration" class="time-display">0:00</span>
            </div>

            <div class="button-row">
                <button id="restartButton" class="music-button" onclick="restartTrack()" title="Reconnect / Start Again">
                    <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
                </button>
                <button id="prevButton" class="music-button" onclick="playPrevious()" title="Previous Song">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button id="playButton" class="music-button" onclick="togglePlayPause()" title="Play">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button id="pauseButton" class="music-button" onclick="togglePlayPause()" style="display:none;" title="Pause">
                    <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button id="nextButton" class="music-button" onclick="playNext()" title="Next Song">
                    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
                <button id="shuffleButton" class="music-button active-mode" onclick="toggleShuffle()" title="Shuffle">
                    <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                </button>
                <div class="dropdown">
                    <button onclick="togglePlaylistDropdown()" class="music-button" title="Playlist"><span class="pl-text">PL</span></button>
                    <div id="playlistDropdown" class="dropdown-content">
                        <label for="localFileInput">📄 Pick Songs / Files...</label>
                        <input type="file" id="localFileInput" multiple accept="audio/*" style="display:none;" onchange="handleLocalFiles(event)" />
                        <label for="folderInput">📂 Pick Folder / Subfolder...</label>
                        <input type="file" id="folderInput" webkitdirectory directory accept="audio/*" style="display:none;" onchange="handleLocalFiles(event)" />
                        <div id="dropdownTrackList"></div>
                    </div>
                </div>
            </div>

            <div class="volume-container">
                <span id="volumeIcon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                    </svg>
                </span>

    function setupKnobControl(knobEl, onValueChange, minVal, maxVal, defaultVal) {
        if (!knobEl) return;
        var isDragging = false;
        var startY = 0;

        function updateVisualAngle(val) {
            var norm = (val - minVal) / (maxVal - minVal);
            var angle = -135 + norm * 270;
            knobEl.style.transform = 'rotate(' + angle + 'deg)';
            knobEl.setAttribute('data-val', val);
        }

        knobEl.addEventListener('pointerdown', function(e) {
            isDragging = true;
            startY = e.clientY;
            knobEl.setPointerCapture(e.pointerId);
            e.preventDefault();
        });

        knobEl.addEventListener('pointermove', function(e) {
            if (!isDragging) return;
            var deltaY = startY - e.clientY;
            startY = e.clientY;

            var currentVal = parseFloat(knobEl.getAttribute('data-val') || defaultVal);
            var step = (maxVal - minVal) / 100;
            var newVal = Math.min(maxVal, Math.max(minVal, currentVal + deltaY * step));

            updateVisualAngle(newVal);
            onValueChange(newVal);
        });

        knobEl.addEventListener('pointerup', function(e) {
            isDragging = false;
            knobEl.releasePointerCapture(e.pointerId);
        });

        updateVisualAngle(defaultVal);
        return updateVisualAngle;
    }

        var stationInfo = fmStations[key];
        if (stationInfo.useApi) {
            fetch("https://de1.api.radio-browser.info/json/stations/byname/" + encodeURIComponent(stationInfo.query))
                .then(res => res.json())
                .then(data => {
                    if (activeFmKey !== key) return;
                    var resolvedUrl = (data && data.length > 0 && data[0].url_resolved) ? data[0].url_resolved : stationInfo.backup;
                    startStreamUrl(stationInfo.title, resolvedUrl);
                })
                .catch(() => {
                    if (activeFmKey !== key) return;
                    startStreamUrl(stationInfo.title, stationInfo.backup);
                });
        } else {
            startStreamUrl(stationInfo.title, stationInfo.backup);
        }
    }

    function startStreamUrl(title, url) {
        destroyHls();
        currentStreamUrl = url;
        currentTrackTitle.textContent = title;

        if (url.includes('.m3u8')) {
            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(hifiAudio);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    nowPlayingSubtitle.textContent = "LIVE FM RADIO";
                    hifiAudio.play().catch(() => {});
                });
            } else if (hifiAudio.canPlayType('application/vnd.apple.mpegurl')) {
                hifiAudio.src = url;
                hifiAudio.play().catch(() => {});
            }
        } else {
            hifiAudio.src = url;
            hifiAudio.play().catch(() => {});
        }
        updateMediaSession();
    }

    function turnOffRadio() {
        activeFmKey = null;
        currentStreamUrl = null;
        destroyHls();
        document.querySelectorAll('.fm-preset-btn').forEach(btn => btn.classList.remove('active-fm'));
        hifiAudio.pause();
        
        if (currentLocalPlaylist.length > 0) {
            playLocalTrack(localTrackIndex);
        } else {
            loadTrack(currentTrackIndex, true);
        }
    }

    function exitApp() {
        destroyHls();
        if (hifiAudio) hifiAudio.pause();
        if (wakeLock) wakeLock.release().catch(()=>{});
        try { window.close(); } catch(e) {}
        setTimeout(() => { window.location.href = "about:blank"; }, 300);
    }

    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch (err) {}
    }

    function handleLocalFiles(event) {
        var files = event.target.files;
        if (!files || files.length === 0) return;

        currentLocalPlaylist = [];
        activeFmKey = null;
        destroyHls();
        document.querySelectorAll('.fm-preset-btn').forEach(btn => btn.classList.remove('active-fm'));

        for (var j = 0; j < files.length; j++) {
            var file = files[j];
            if (file.type.startsWith('audio/') || file.name.match(/\.(mp3|wav|ogg|m4a|aac)$/i)) {
                var objectUrl = URL.createObjectURL(file);
                var cleanTitle = file.name.replace(/\.[^/.]+$/, "");
                currentLocalPlaylist.push({ title: cleanTitle, src: objectUrl });
            }
        }

        if (currentLocalPlaylist.length > 0) {
            currentLocalPlaylist.sort((a, b) => a.title.localeCompare(b.title, undefined, { sensitivity: 'base' }));
            isPlayingLocal = true;
            togglePlaylistDropdown();
            playLocalTrack(0);
        }
        event.target.value = '';
    }

    function getNextLocalIndex() {
        if (currentLocalPlaylist.length <= 1) return 0;
        if (isShuffle) {
            var randIdx;
            do {
                randIdx = Math.floor(Math.random() * currentLocalPlaylist.length);
            } while (randIdx === localTrackIndex);
            return randIdx;
        } else {
            return (localTrackIndex + 1) % currentLocalPlaylist.length;
        }
    }

    function playLocalTrack(index) {
        if (currentLocalPlaylist.length === 0) return;
        localTrackIndex = index;
        destroyHls();
        clearLoadGuard();
        hifiAudio.src = currentLocalPlaylist[localTrackIndex].src;
        hifiAudio.play().then(() => {
            hasUserStartedPlayback = true;
            requestWakeLock();
        }).catch(() => {});
    }

    function updateMediaSession() {
        if ('mediaSession' in navigator) {
            var activeTitle = activeFmKey ? fmStations[activeFmKey].title : (isPlayingLocal ? currentLocalPlaylist[localTrackIndex].title : playlist[currentTrackIndex].title);
            navigator.mediaSession.metadata = new MediaMetadata({
                title: activeTitle,
                artist: "Chanthiran Music Player",
                album: activeFmKey ? "FM Tuner" : "BGM Player"
            });
            navigator.mediaSession.playbackState = hifiAudio.paused ? "paused" : "playing";

            navigator.mediaSession.setActionHandler('play', () => togglePlayPause());
            navigator.mediaSession.setActionHandler('pause', () => togglePlayPause());
            navigator.mediaSession.setActionHandler('previoustrack', () => playPrevious());
            navigator.mediaSession.setActionHandler('nexttrack', () => playNext());
        }
    }

    function applyVolumeGain() {
        var val = parseFloat(volumeSlider.value);
        hifiAudio.volume = Math.min(1.0, Math.max(0.0, val));
        boostText.textContent = (Math.round(val * 10) / 10) + "x";
        if (typeof updateVolumeKnobAngle === 'function') {
            updateVolumeKnobAngle(val);
        }
    }

    function cycleBoostMode() {
        var val = parseFloat(volumeSlider.value);
        if (val < 0.5) volumeSlider.value = 0.5;
        else if (val < 0.8) volumeSlider.value = 0.8;
        else if (val < 1.0) volumeSlider.value = 1.0;
        else volumeSlider.value = 0.5;
        applyVolumeGain();
    }

    function animateVUMeters() {
        requestAnimationFrame(animateVUMeters);
        if (!hifiAudio.paused && hifiAudio.volume > 0) {
            var vol = hifiAudio.volume;
            var t = Date.now() / 1000;
            var beat = Math.pow(Math.sin(t * Math.PI * 2.1), 4) * 0.75 + Math.random() * 0.25;
            var targetL = beat * 75 * vol;
            var targetR = (beat * 0.88 + Math.random() * 0.12) * 75 * vol;
            
            vuLevelL += (targetL - vuLevelL) * 0.28;
            vuLevelR += (targetR - vuLevelR) * 0.28;
            
            vuNeedleL.style.transform = 'rotate(' + (-42 + Math.min(84, vuLevelL)) + 'deg)';
            vuNeedleR.style.transform = 'rotate(' + (-42 + Math.min(84, vuLevelR)) + 'deg)';
        } else {
            vuLevelL += (0 - vuLevelL) * 0.15;
            vuLevelR += (0 - vuLevelR) * 0.15;
            vuNeedleL.style.transform = 'rotate(' + (-42 + vuLevelL) + 'deg)';
            vuNeedleR.style.transform = 'rotate(' + (-42 + vuLevelR) + 'deg)';
        }
    }

    function renderVisualizer() {
        requestAnimationFrame(renderVisualizer);
        canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
        var numBars = 24, barWidth = 8, gap = 10;
        var startX = (canvas.width - (numBars * (barWidth + gap))) / 2;
        var vol = hifiAudio.volume;
        var t = Date.now() / 1000;

        for (var i = 0; i < numBars; i++) {
            var x = startX + i * (barWidth + gap);
            if (!hifiAudio.paused && vol > 0) {
                var freqFactor;
                if (i < 7) {
                    freqFactor = Math.pow(Math.sin(t * 7 + i * 0.25), 4) * 0.7 + 0.3;
                } else if (i < 16) {
                    freqFactor = (Math.sin(t * 11 + i * 0.4) * 0.3 + Math.cos(t * 13 + i * 0.7) * 0.3 + 0.4);
                } else {
                    freqFactor = Math.random() * 0.5 + Math.sin(t * 19 + i) * 0.2 + 0.3;
                }

                var targetHeight = Math.max(4, freqFactor * (canvas.height - 12) * vol);
                barLevels[i] += (targetHeight - barLevels[i]) * 0.35;
                var barHeight = barLevels[i];

                if (!capHeights[i] || barHeight > capHeights[i]) {
                    capHeights[i] = barHeight;
                } else {
                    capHeights[i] = Math.max(4, capHeights[i] - 0.7);
                }

                var gradient = canvasCtx.createLinearGradient(0, canvas.height, 0, 0);
                gradient.addColorStop(0, '#ff4b1f');
                gradient.addColorStop(0.6, '#ffaa00');
                gradient.addColorStop(1, '#00e5ff');

                canvasCtx.fillStyle = gradient;
                canvasCtx.fillRect(x, canvas.height - barHeight - 2, barWidth, barHeight);

                canvasCtx.fillStyle = '#ffffff';
                canvasCtx.beginPath();
                canvasCtx.arc(x + barWidth / 2, canvas.height - capHeights[i] - 5, 2, 0, Math.PI * 2);
                canvasCtx.fill();
            } else {
                canvasCtx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                canvasCtx.fillRect(x, canvas.height - 6, barWidth, 3);
            }
        }
    }

    function formatTime(seconds) {
        var min = Math.floor(seconds / 60);
        var sec = Math.floor(seconds % 60);
        return min + ':' + (sec < 10 ? '0' + sec : sec);
    }

    function populatePlaylistDropdown() {
        dropdownTrackList.innerHTML = '';
        playlist.forEach(function(track, index) {
            var a = document.createElement('a');
            a.href = '#';
            a.textContent = track.title;
            a.onclick = function(e) { 
                e.preventDefault(); 
                activeFmKey = null;
                destroyHls();
                document.querySelectorAll('.fm-preset-btn').forEach(btn => btn.classList.remove('active-fm'));
                isPlayingLocal = false; 
                loadTrack(index, true); 
                togglePlaylistDropdown(); 
            };
            dropdownTrackList.appendChild(a);
        });
    }

    function updateActiveTrackHighlight() {
        Array.from(dropdownTrackList.children).forEach((item, idx) => {
            item.classList.toggle('active', !isPlayingLocal && !activeFmKey && idx === currentTrackIndex);
        });
    }

    function toggleShuffle() {
        isShuffle = !isShuffle;
        shuffleButton.classList.toggle('active-mode', isShuffle);
    }

    function getRandomIndex() {
        if (playlist.length <= 1) return 0;
        var randomIndex;
        do {
            randomIndex = Math.floor(Math.random() * playlist.length);
        } while (randomIndex === currentTrackIndex);
        return randomIndex;
    }

    function restartTrack() {
        if (activeFmKey) {
            playFmStation(activeFmKey);
            return;
        }
        hifiAudio.currentTime = 0;
        hifiAudio.play().catch(()=>{});
    }

    function syncTrackUI() {
        hasUserStartedPlayback = true;
        if (activeFmKey) {
            nowPlayingSubtitle.textContent = "LIVE FM RADIO";
            currentTrackTitle.textContent = fmStations[activeFmKey].title;
        } else {
            var title = isPlayingLocal ? currentLocalPlaylist[localTrackIndex].title : playlist[currentTrackIndex].title;
            nowPlayingSubtitle.textContent = "NOW PLAYING";
            currentTrackTitle.textContent = title;
        }
        updateActiveTrackHighlight();
        updateMediaSession();
    }

    function loadTrack(index, autoPlay = true) {
        if (playlist.length === 0) return;
        activeFmKey = null;
        destroyHls();
        clearLoadGuard();
        isPlayingLocal = false;
        currentTrackIndex = index;

        // Set source
        hifiAudio.src = playlist[currentTrackIndex].src;
        syncTrackUI();

        if (autoPlay) {
            var playPromise = hifiAudio.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    requestWakeLock();
                }).catch(() => {
                    setTimeout(() => {
                        hifiAudio.play().catch(()=>{});
                    }, 250);
                });
            }
        }
    }

    function togglePlayPause() {
        if (isPlayingLocal && currentLocalPlaylist.length > 0 && !hasUserStartedPlayback) {
            playLocalTrack(0);
            return;
        }

        if (hifiAudio.paused) { 
            hifiAudio.play().catch(()=>{});
        } else { 
            hifiAudio.pause(); 
        }
    }

    function playNext() {
        clearLoadGuard();
        if (activeFmKey) return;

        if (isPlayingLocal && currentLocalPlaylist.length > 0) {
            playLocalTrack(getNextLocalIndex());
            return;
        }

        if (playlist.length === 0) return;
        var nextIdx = isShuffle ? getRandomIndex() : (currentTrackIndex + 1) % playlist.length;
        loadTrack(nextIdx, true);
    }

    function playPrevious() {
        clearLoadGuard();
        if (activeFmKey) return;
        if (isPlayingLocal && currentLocalPlaylist.length > 0) {
            var prevLocalIndex = (localTrackIndex - 1 + currentLocalPlaylist.length) % currentLocalPlaylist.length;
            playLocalTrack(prevLocalIndex);
            return;
        }

        if (playlist.length === 0) return;
        var prevIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
        loadTrack(prevIndex, true);
    }

    function togglePlaylistDropdown() { playlistDropdown.parentElement.classList.toggle('show'); }

    /* --- NATIVE CONTINUOUS EVENT LISTENERS & AUTO-RECOVERY --- */
    hifiAudio.addEventListener('ended', function() {
        playNext();
    });

    // AUTO-RECOVER FROM DEAD/BLOCKED SONGS
    hifiAudio.addEventListener('error', function() {
        clearLoadGuard();
        nowPlayingSubtitle.textContent = "SKIPPING UNAVAILABLE TRACK...";
        setTimeout(playNext, 1000);
    });

    // PREVENT INFINITE BUFFERING
    hifiAudio.addEventListener('waiting', function() {
        clearLoadGuard();
        loadTimeout = setTimeout(function() {
            if (hifiAudio.readyState < 3 && !hifiAudio.paused) {
                playNext();
            }
        }, 4000);
    });

    hifiAudio.addEventListener('playing', () => {
        clearLoadGuard();
        syncTrackUI();
        playButton.style.display = 'none'; 
        pauseButton.style.display = 'inline-flex'; 
        tapeLeft.classList.add('spinning');
        tapeRight.classList.add('spinning');
    });

    hifiAudio.addEventListener('pause', () => { 
        if (hifiAudio.paused) {
            playButton.style.display = 'inline-flex'; 
            pauseButton.style.display = 'none'; 
            tapeLeft.classList.remove('spinning');
            tapeRight.classList.remove('spinning');
            updateMediaSession();
        }
    });

    hifiAudio.addEventListener('timeupdate', () => {
        if (!activeFmKey && !isNaN(hifiAudio.duration) && hifiAudio.duration > 0) {
            progressSlider.value = hifiAudio.currentTime;
            currentTimeSpan.textContent = formatTime(hifiAudio.currentTime);
        }
    });

    hifiAudio.addEventListener('loadedmetadata', () => {
        if (!activeFmKey && !isNaN(hifiAudio.duration)) {
            progressSlider.max = hifiAudio.duration;
            durationSpan.textContent = formatTime(hifiAudio.duration);
        }
        syncTrackUI();
    });

    volumeSlider.addEventListener('input', () => applyVolumeGain());

    progressSlider.addEventListener('input', () => { 
        if (!activeFmKey) {
            hifiAudio.currentTime = progressSlider.value;
        }
    });

    window.onclick = function(event) {
        if (!event.target.closest('.music-button') && !event.target.matches('.pl-text')) {
            document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
        }
    };

    function initPlayer() {
        populatePlaylistDropdown();
        animateVUMeters();
        renderVisualizer();
        loadTrack(Math.floor(Math.random() * playlist.length), false);
        applyVolumeGain();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initPlayer);
    } else {
        initPlayer();
    }

    /* --- SERVICE WORKER --- */
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('sw.js').catch(function() {});
        });
    }
</script>
</body>
