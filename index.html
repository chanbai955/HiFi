<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chanthiran Mini HiFi System</title>
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffaa00">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- HLS Engine for Live Dynamic Streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Orbitron:wght@600;800;900&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0c;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .music-player-container {
            width: 100%;
            min-height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
            background: linear-gradient(145deg, #22252a 0%, #111215 100%);
            border: 3px solid #3a3f47;
            border-radius: 12px;
            box-shadow: 0 0 35px rgba(0,0,0,0.9), inset 0 1px 2px rgba(255,255,255,0.15);
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: flex-start;
            align-items: center;
            position: relative;
        }

        .hifi-body-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .top-deck-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid #2e333d;
            padding-bottom: 6px;
        }

        .brand-label {
            font-family: 'Dancing Script', cursive;
            font-size: 1.7rem;
            color: #ffaa00;
            text-shadow: 0px 2px 10px rgba(255, 170, 0, 0.5);
            letter-spacing: 0.5px;
            user-select: none;
        }

        .top-right-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .compo-model-no {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem;
            color: #6c757d;
            letter-spacing: 1.2px;
        }

        .tape-toggle-btn {
            background: linear-gradient(145deg, #2a2e38, #16181f);
            border: 1px solid #454c59;
            color: #ffaa00;
            padding: 4px 7px;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .tape-toggle-btn.active-mode {
            background: linear-gradient(145deg, #ffaa00, #ff7700);
            color: #111;
            border-color: #ffaa00;
        }

        .exit-btn {
            background: linear-gradient(145deg, #ff3333, #990000);
            border: 1px solid #ff6666;
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 6px rgba(255, 0, 0, 0.4);
            transition: all 0.15s ease;
        }

        .exit-btn svg { width: 12px; height: 12px; fill: currentColor; }
        .exit-btn:active { transform: scale(0.92); }

        .compact-amp-panel {
            width: 100%;
            background: transparent !important;
            border: 1px dashed #454c59;
            border-radius: 6px;
            padding: 8px 12px;
            color: #fff;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .amp-knobs-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 4px 0;
        }

        .amp-knob-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .amp-knob-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem;
            font-weight: 800;
            color: #00e5ff;
            text-shadow: 0 0 6px rgba(0, 229, 255, 0.4);
        }

        .knob-3d {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: conic-gradient(
                #e2e8f0 0deg, #94a3b8 45deg, #cbd5e1 90deg, #64748b 135deg,
                #f1f5f9 180deg, #94a3b8 225deg, #cbd5e1 270deg, #475569 315deg, #e2e8f0 360deg
            );
            border: 2px solid #1e293b;
            box-shadow: 0 4px 8px rgba(0,0,0,0.8), inset 0 1px 3px rgba(255,255,255,0.9);
            position: relative;
            cursor: grab;
            user-select: none;
            touch-action: none;
            transform: rotate(0deg);
        }

        .knob-3d.large { width: 44px; height: 44px; transform: rotate(-81deg); }
        .knob-3d::after {
            content: '';
            position: absolute;
            top: 3px; left: 50%;
            transform: translateX(-50%);
            width: 3px; height: 10px;
            background: #0f172a;
            border-radius: 2px;
        }
        .knob-3d.large::after { height: 14px; }

        .vu-meters-wrapper {
            width: 100%;
            display: flex;
            gap: 8px;
        }

        .vu-meter-unit {
            flex: 1;
            height: 50px;
            background: #11160a;
            border: 2px solid #2c3224;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .vu-meter-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 100%, rgba(255, 204, 0, 0.25) 0%, rgba(0,0,0,0.85) 75%);
        }

        .vu-needle {
            position: absolute;
            bottom: -5px;
            width: 2px;
            height: 45px;
            background: #ff3300;
            transform-origin: bottom center;
            transform: rotate(-42deg);
            box-shadow: 0 0 4px #ff3300;
            z-index: 2;
        }

        .vu-scale {
            position: absolute;
            top: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem;
            color: #a3b899;
            width: 100%;
            text-align: center;
            letter-spacing: 2px;
            z-index: 1;
        }

        .vu-peak-led {
            position: absolute;
            top: 6px;
            right: 8px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #2a0000;
            border: 1px solid #4a0000;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
            z-index: 3;
            pointer-events: none;
            transition: background 0.04s ease, box-shadow 0.04s ease;
        }

        .vu-peak-led.lit {
            background: #ff1a1a;
            border-color: #ff8080;
            box-shadow: 0 0 8px #ff2200, 0 0 14px rgba(255, 34, 0, 0.8), inset 0 0 2px #ffffff;
        }

        .visualizer-container {
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            border: 1px solid #2c323d;
            border-radius: 6px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        #visualizerCanvas {
            background: transparent !important;
            width: 100%;
            max-width: 420px;
            height: 100%;
        }

        .vfd-display-panel {
            width: 100%;
            background: #000;
            border: 2px solid #1c2628;
            border-radius: 6px;
            padding: 6px 12px;
            box-shadow: inset 0 0 15px rgba(0, 229, 255, 0.15), 0 0 8px rgba(0,0,0,0.8);
            text-align: center;
        }

        .vfd-offline-alert {
            display: none;
            background: rgba(255, 51, 51, 0.15);
            border: 1px solid #ff3333;
            color: #ff4d4d;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            padding: 3px 6px;
            margin-bottom: 4px;
            border-radius: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(255, 51, 51, 0.7);
            animation: vfdBlink 1.4s ease-in-out infinite;
        }

        .vfd-offline-alert.show { display: block; }

        @keyframes vfdBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        #nowPlayingSubtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            color: #ffaa00;
            margin: 0 0 2px 0;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #currentTrackTitle {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            margin: 0;
            color: #00e5ff;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.7);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* TAPE DECK & VINYL STROBE WELL */
        .cassette-deck-well {
            width: 100%;
            height: 110px;
            background: #0d0f12;
            border: 2px solid #323842;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .cassette-deck-well svg.cdeck-svg { width: 100%; height: 100%; display: block; }

        /* AUDIO-REACTIVE NEON BADGE STYLES */
        .neon-badge-group {
            filter: drop-shadow(0 0 2px rgba(0, 229, 255, 0.3));
            transition: filter 0.05s ease-out, opacity 0.05s ease-out;
            will-change: filter, opacity;
        }

        .neon-note, .neon-note-bottom {
            transition: fill 0.1s ease-out;
            will-change: fill;
        }

        .spool-overlay-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }

        .spool-left-wrapper { position: absolute; left: 23.5%; top: 42.5%; transform: translate(-50%, -50%); }
        .spool-right-wrapper { position: absolute; left: 51.5%; top: 42.5%; transform: translate(-50%, -50%); }

        .tape-wheel {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: #181c22;
            border: 3px solid #728096;
            box-shadow: 0 0 8px rgba(0,0,0,0.9);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .spoke-cross {
            position: absolute;
            width: 100%; height: 100%;
            top: 0; left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .spoke-bar-h, .spoke-bar-v { position: absolute; background: #e2e8f0; border-radius: 2px; }
        .spoke-bar-h { width: 24px; height: 5px; }
        .spoke-bar-v { width: 5px; height: 24px; }

        .tape-wheel.spinning { animation: spinWheel 2.5s linear infinite; }
        @keyframes spinWheel { 100% { transform: rotate(360deg); } }

        /* VINYL TURNTABLE & STROBE SYSTEM */
        .vinyl-well-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            background: radial-gradient(circle at 45% 50%, #16181e 0%, #08090b 80%);
            z-index: 2;
        }

        .vinyl-well-overlay.active { display: block; }

        .turntable-record {
            position: absolute;
            left: 36%;
            top: 50%;
            width: 106px;
            height: 106px;
            margin-top: -53px;
            margin-left: -53px;
            border-radius: 50%;
            background: repeating-radial-gradient(
                circle,
                #14171d 0px,
                #0b0d11 2px,
                #181c24 3px,
                #0d0f14 4px
            );
            border: 2px solid #2e3542;
            box-shadow: 0 0 16px rgba(0,0,0,0.95), inset 0 0 10px rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .turntable-record.spinning {
            animation: spinRecord 1.8s linear infinite;
        }

        @keyframes spinRecord { 100% { transform: rotate(360deg); } }

        .groove-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.08);
            pointer-events: none;
        }
        .ring-1 { width: 88px; height: 88px; }
        .ring-2 { width: 68px; height: 68px; }
        .ring-3 { width: 50px; height: 50px; }

        .strobe-dots-rim {
            position: absolute;
            width: 98px;
            height: 98px;
            border-radius: 50%;
            border: 2px dotted #00e5ff;
            opacity: 0.35;
        }

        .vinyl-center-label {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffaa00 0%, #d46b00 100%);
            border: 1px solid #ffe082;
            box-shadow: 0 0 5px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .rpm-mark {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.42rem;
            font-weight: 900;
            color: #111;
            letter-spacing: -0.5px;
            user-select: none;
        }

        .center-spindle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #cbd5e1;
            border: 1px solid #1e293b;
            border-radius: 50%;
            z-index: 2;
            box-shadow: 0 0 3px #000;
        }

        .tonearm-stylus {
            position: absolute;
            right: 28%;
            top: 20%;
            width: 70px;
            height: 60px;
            pointer-events: none;
            transform-origin: 65px 6px;
            transform: rotate(-18deg);
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.3, 1.2);
        }

        .tonearm-stylus.cued { transform: rotate(8deg); }

        .tonearm-rod {
            position: absolute;
            right: 6px;
            top: 6px;
            width: 58px;
            height: 2px;
            background: linear-gradient(90deg, #64748b, #cbd5e1);
            transform: rotate(-22deg);
            transform-origin: right center;
            border-radius: 1px;
        }

        .cartridge-body {
            position: absolute;
            left: 0px;
            top: 25px;
            width: 9px;
            height: 13px;
            background: #ffaa00;
            border: 1px solid #fff;
            border-radius: 2px;
            box-shadow: 0 0 4px rgba(0,0,0,0.8);
        }

        .fm-tuner-panel {
            width: 100%;
            background: linear-gradient(145deg, #14161a 0%, #0a0b0d 100%);
            border: 2px solid #2c323d;
            border-radius: 6px;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .fm-tuner-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.58rem;
            color: #ffaa00;
            letter-spacing: 1.5px;
            font-weight: 800;
            text-align: center;
        }

        .fm-buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            width: 100%;
        }

        .fm-preset-btn {
            background: linear-gradient(145deg, #2a2e38, #16181f);
            border: 1px solid #454c59;
            color: #00e5ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem;
            font-weight: 800;
            padding: 6px 2px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fm-preset-btn.active-fm { color: #111; background: linear-gradient(145deg, #ffaa00, #ff7700); border-color: #ffaa00; }
        .fm-preset-btn.off-btn { color: #ff6666; border-color: #ff3333; }

        .controls-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            background: #111;
            border: 1px solid #333;
            border-radius: 3px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 18px;
            width: 18px;
            background: linear-gradient(145deg, #e6e6e6, #888888);
            border: 1px solid #222;
            border-radius: 3px;
            margin-top: -6px;
        }

        #progressSlider { flex: 1; }
        .time-display { font-family: 'Orbitron', sans-serif; font-size: 0.7rem; color: #ffaa00; min-width: 36px; font-weight: 700; }

        .button-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 0 2px;
        }

        .music-button {
            cursor: pointer;
            border: 1px solid #454c59 !important;
            outline: none !important;
            padding: 0 !important;
            margin: 0;
            border-radius: 6px;
            color: #d1d5db;
            background: linear-gradient(145deg, #3a404d, #1f232b) !important;
            box-shadow: 0 4px 0 #111317;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 38px;
            transition: all 0.15s ease;
        }

        .music-button svg { width: 18px; height: 18px; fill: currentColor; }
        .music-button.active-mode { color: #ffaa00; border-color: #ffaa00 !important; }
        .music-button.saved-offline {
            color: #00e5ff !important;
            border-color: #00e5ff !important;
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
        }
        .pl-text { font-family: 'Orbitron', sans-serif; font-size: 0.8rem; font-weight: 800; }

        .dropdown { position: relative; display: inline-block; }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #181a1f;
            min-width: 285px;
            max-width: 88vw;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.9);
            z-index: 1000;
            right: 0;
            bottom: 100%;
            margin-bottom: 12px;
            border-radius: 8px;
            max-height: 50vh;
            overflow-y: auto;
            border: 2px solid #ffaa00;
        }
        .dropdown.show .dropdown-content { display: block; }
        .dropdown-content a, .dropdown-content label {
            color: #eee;
            padding: 10px 14px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            font-family: 'Orbitron', sans-serif;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            cursor: pointer;
        }
        .dropdown-content a.active { background-color: #353b47; color: #ffaa00; font-weight: bold; }

        /* PLAYLIST TABS, SEARCH, AND STORAGE PROGRESS BAR */
        .playlist-tab-bar {
            display: flex;
            width: 100%;
            background: #111317;
            border-bottom: 2px solid #2a2e38;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .pl-filter-tab {
            flex: 1;
            padding: 8px 4px;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.62rem;
            font-weight: 800;
            color: #8892a0;
            background: transparent;
            border: none;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.15s ease;
        }

        .pl-filter-tab.active-tab {
            color: #00e5ff;
            border-bottom-color: #00e5ff;
            background: rgba(0, 229, 255, 0.08);
            text-shadow: 0 0 6px rgba(0, 229, 255, 0.4);
        }

        .playlist-search-container {
            width: 100%;
            display: flex;
            align-items: center;
            background: #101216;
            padding: 6px 10px;
            border-bottom: 1px solid #282f3a;
            gap: 6px;
            position: sticky;
            top: 33px;
            z-index: 9;
        }

        .search-icon {
            font-size: 0.65rem;
            color: #ffaa00;
            user-select: none;
        }

        .playlist-search-input {
            flex: 1;
            background: #171a21;
            border: 1px solid #333a47;
            border-radius: 4px;
            color: #00e5ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.62rem;
            padding: 4px 8px;
            outline: none;
            letter-spacing: 0.8px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .playlist-search-input:focus {
            border-color: #00e5ff;
            box-shadow: 0 0 6px rgba(0, 229, 255, 0.4);
        }

        .playlist-search-input::placeholder {
            color: #64748b;
            font-size: 0.58rem;
        }

        .clear-search-btn {
            background: transparent;
            border: none;
            color: #64748b;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            cursor: pointer;
            padding: 0 4px;
            display: none;
        }

        .clear-search-btn.show { display: block; }
        .clear-search-btn:hover { color: #ff4d4d; }

        .storage-info-row {
            width: 100%;
            padding: 6px 10px 8px 10px;
            background: #111317;
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-bottom: 1px solid #1f242d;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem;
            letter-spacing: 1px;
        }

        .storage-text-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .storage-info-label {
            color: #8892a0;
            font-weight: 700;
        }

        .storage-usage-val {
            color: #00e5ff;
            font-weight: 800;
            text-shadow: 0 0 6px rgba(0, 229, 255, 0.4);
        }

        .storage-progress-track {
            width: 100%;
            height: 4px;
            background: #1a1e26;
            border-radius: 2px;
            overflow: hidden;
            border: 1px solid #2d3542;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
        }

        .storage-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffaa00, #00e5ff);
            box-shadow: 0 0 6px #00e5ff;
            border-radius: 2px;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bulk-download-bar {
            width: 100%;
            padding: 6px 8px;
            background: #15181e;
            border-bottom: 1px solid #282f3a;
            display: flex;
            gap: 6px;
            justify-content: space-between;
        }

        .bulk-btn {
            flex: 1;
            background: linear-gradient(145deg, #252b36, #161a22);
            border: 1px solid #00e5ff;
            color: #00e5ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem;
            font-weight: 800;
            padding: 6px 4px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            letter-spacing: 0.8px;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .bulk-btn:active { transform: scale(0.97); }

        .bulk-btn.downloading {
            background: linear-gradient(145deg, #ffaa00, #b37400);
            border-color: #ffaa00;
            color: #111;
            animation: bulkPulse 1.2s infinite alternate;
        }

        @keyframes bulkPulse {
            0% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        .bulk-btn.clear-btn {
            flex: 0 0 70px;
            border-color: #ff4d4d;
            color: #ff4d4d;
        }

        .bulk-btn.clear-btn:active {
            background: linear-gradient(145deg, #ff3333, #990000);
            color: #fff;
            transform: scale(0.95);
        }

        .offline-item-badge {
            display: inline-block;
            font-size: 0.55rem;
            color: #00e5ff;
            background: rgba(0, 229, 255, 0.15);
            border: 1px solid #00e5ff;
            border-radius: 3px;
            padding: 1px 4px;
            margin-left: 6px;
            vertical-align: middle;
        }

        .empty-offline-notice {
            padding: 14px 10px;
            text-align: center;
            color: #888;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 1px;
            line-height: 1.5;
        }

        .volume-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
            background: #181b20;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #2a2e38;
        }
        #volumeIcon { color: #ffaa00; }
        .boost-btn {
            background: linear-gradient(145deg, #3a404d, #1f232b);
            border: 1px solid #ffaa00;
            color: #ffaa00;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
        #volumeSlider { flex: 1; }
    </style>
</head>

                        <label for="folderInput">📂 Pick Folder / Subfolder...</label>

                        <div id="dropdownTrackList"></div>
                    </div>
                </div>

    /* --- INDEXEDDB AUDIO CACHE ENGINE --- */
    function openOfflineDB() {
        return new Promise(function(resolve, reject) {
            if (dbInstance) return resolve(dbInstance);
            var request = indexedDB.open(DB_NAME, DB_VERSION);

            request.onupgradeneeded = function(e) {
                var db = e.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME, { keyPath: 'title' });
                }
            };

            request.onsuccess = function(e) {
                dbInstance = e.target.result;
                resolve(dbInstance);
            };

            request.onerror = function(e) {
                reject(e);
            };
        });
    }

    function saveTrackToDB(trackTitle, audioBlob) {
        return openOfflineDB().then(function(db) {
            return new Promise(function(resolve, reject) {
                var tx = db.transaction(STORE_NAME, 'readwrite');
                var store = tx.objectStore(STORE_NAME);
                store.put({ title: trackTitle, blob: audioBlob, timestamp: Date.now() });
                tx.oncomplete = function() { resolve(true); };
                tx.onerror = function(e) { reject(e); };
            });
        });
    }

    function getTrackFromDB(trackTitle) {
        return openOfflineDB().then(function(db) {
            return new Promise(function(resolve) {
                var tx = db.transaction(STORE_NAME, 'readonly');
                var store = tx.objectStore(STORE_NAME);
                var req = store.get(trackTitle);
                req.onsuccess = function() {
                    resolve(req.result ? req.result.blob : null);
                };
                req.onerror = function() { resolve(null); };
            });
        });
    }

    function removeTrackFromDB(trackTitle) {
        return openOfflineDB().then(function(db) {
            return new Promise(function(resolve, reject) {
                var tx = db.transaction(STORE_NAME, 'readwrite');
                var store = tx.objectStore(STORE_NAME);
                store.delete(trackTitle);
                tx.oncomplete = function() { resolve(true); };
                tx.onerror = function(e) { reject(e); };
            });
        });
    }

    function getAllSavedTrackTitles() {
        return openOfflineDB().then(function(db) {
            return new Promise(function(resolve) {
                var tx = db.transaction(STORE_NAME, 'readonly');
                var store = tx.objectStore(STORE_NAME);
                var req = store.getAllKeys();
                req.onsuccess = function() {
                    resolve(req.result || []);
                };
                req.onerror = function() {
                    resolve([]);
                };
            });
        });
    }

    function clearAllStoredTracksFromDB() {
        return openOfflineDB().then(function(db) {
            return new Promise(function(resolve, reject) {
                var tx = db.transaction(STORE_NAME, 'readwrite');
                var store = tx.objectStore(STORE_NAME);
                var req = store.clear();
                tx.oncomplete = function() { resolve(true); };
                tx.onerror = function(e) { reject(e); };
            });
        });
    }

    function calculateOfflineStorageSize() {
        return openOfflineDB().then(function(db) {
            return new Promise(function(resolve) {
                var tx = db.transaction(STORE_NAME, 'readonly');
                var store = tx.objectStore(STORE_NAME);
                var req = store.openCursor();
                var totalBytes = 0;

                req.onsuccess = function(e) {
                    var cursor = e.target.result;
                    if (cursor) {
                        if (cursor.value && cursor.value.blob) {
                            totalBytes += cursor.value.blob.size || 0;
                        }
                        cursor.continue();
                    } else {
                        resolve(totalBytes);
                    }
                };

                req.onerror = function() {
                    resolve(0);
                };
            });
        });
    }

    function formatBytes(bytes) {
        if (!bytes || bytes === 0) return "0.0 MB";
        var mb = bytes / (1024 * 1024);
        if (mb < 0.1) {
            var kb = bytes / 1024;
            return kb.toFixed(1) + " KB";
        }
        return mb.toFixed(1) + " MB";
    }

    function updateSavedCountDisplay() {
        var savedLabel = document.getElementById('savedCountLabel');
        var totalLabel = document.getElementById('totalCountLabel');
        var storageUsageLabel = document.getElementById('storageUsageLabel');
        var storageProgressBar = document.getElementById('storageProgressBar');

        var totalTracks = playlist.length;
        if (totalLabel) totalLabel.textContent = totalTracks;

        Promise.all([
            getAllSavedTrackTitles(),
            calculateOfflineStorageSize()
        ]).then(function(results) {
            var savedTitles = results[0];
            var totalBytes = results[1];
            var savedCount = savedTitles.length;

            if (savedLabel) savedLabel.textContent = savedCount;

            var percent = totalTracks > 0 ? Math.round((savedCount / totalTracks) * 100) : 0;

            if (storageUsageLabel) {
                storageUsageLabel.textContent = formatBytes(totalBytes) + " (" + percent + "%)";
            }

            if (storageProgressBar) {
                storageProgressBar.style.width = Math.min(100, Math.max(0, percent)) + "%";
            }
        });
    }

    function toggleSaveCurrentTrack() {
        if (activeFmKey) return;
        var currentTrack = playlist[currentTrackIndex];

        getTrackFromDB(currentTrack.title).then(function(existingBlob) {
            if (existingBlob) {
                removeTrackFromDB(currentTrack.title).then(function() {
                    updateCacheButtonState(false);
                    nowPlayingSubtitle.textContent = "REMOVED FROM OFFLINE CACHE";
                    updateSavedCountDisplay();
                    populatePlaylistDropdown();
                    setTimeout(syncTrackUI, 2000);
                });
            } else {
                nowPlayingSubtitle.textContent = "DOWNLOADING TRACK FOR OFFLINE...";
                fetch(currentTrack.src)
                    .then(function(res) {
                        if (!res.ok) throw new Error("Download failed");
                        return res.blob();
                    })
                    .then(function(blob) {
                        return saveTrackToDB(currentTrack.title, blob);
                    })
                    .then(function() {
                        updateCacheButtonState(true);
                        nowPlayingSubtitle.textContent = "SAVED TO OFFLINE CACHE (INDEXEDDB)";
                        updateSavedCountDisplay();
                        populatePlaylistDropdown();
                        setTimeout(syncTrackUI, 2500);
                    })
                    .catch(function() {

        });

    async function toggleBulkDownload(event) {
        if (event) event.stopPropagation();
        playMechanicalSwitchClick();

        var bulkBtn = document.getElementById('bulkDownloadBtn');

        if (isBulkDownloading) {
            cancelBulkDownload = true;
            nowPlayingSubtitle.textContent = "STOPPING BULK DOWNLOAD...";
            return;
        }

        if (!navigator.onLine) {
            nowPlayingSubtitle.textContent = "CANNOT DOWNLOAD: DEVICE IS OFFLINE";
            setTimeout(syncTrackUI, 2500);
            return;
        }

        isBulkDownloading = true;
        cancelBulkDownload = false;
        bulkBtn.classList.add('downloading');

        var savedTitles = await getAllSavedTrackTitles();
        var savedSet = new Set(savedTitles);

        var queue = playlist.filter(function(track) {
            return !savedSet.has(track.title);
        });

        if (queue.length === 0) {
            nowPlayingSubtitle.textContent = "ALL TRACKS ARE ALREADY SAVED!";
            bulkBtn.classList.remove('downloading');
            isBulkDownloading = false;
            setTimeout(syncTrackUI, 2500);
            return;
        }

        var totalToDownload = queue.length;
        var downloaded = 0;

        for (var i = 0; i < queue.length; i++) {
            if (cancelBulkDownload) {
                nowPlayingSubtitle.textContent = "BULK DOWNLOAD CANCELLED";
                break;
            }

            var track = queue[i];
            bulkBtn.textContent = `⏸ STOP (${i + 1}/${totalToDownload})`;
            nowPlayingSubtitle.textContent = `DOWNLOADING (${i + 1}/${totalToDownload}): ${track.title}`;

            try {
                var response = await fetch(track.src);
                if (!response.ok) throw new Error("HTTP error " + response.status);
                var blob = await response.blob();
                await saveTrackToDB(track.title, blob);
                downloaded++;
                updateSavedCountDisplay();
            } catch (err) {
                console.warn("Failed caching:", track.title, err);
            }
        }

        isBulkDownloading = false;
        bulkBtn.classList.remove('downloading');
        bulkBtn.innerHTML = `⬇ SAVE ALL (<span id="savedCountLabel">0</span>/<span id="totalCountLabel">0</span>)`;
        updateSavedCountDisplay();
        populatePlaylistDropdown();

        if (playlist[currentTrackIndex]) {
            var isCurrentSaved = await getTrackFromDB(playlist[currentTrackIndex].title);
            updateCacheButtonState(!!isCurrentSaved);
        }

        nowPlayingSubtitle.textContent = cancelBulkDownload 
            ? "DOWNLOAD STOPPED" 
            : `SAVED ${downloaded} NEW TRACKS OFFLINE!`;

        setTimeout(syncTrackUI, 3000);
    }

    async function clearAllOfflineStorage(event) {
        if (event) event.stopPropagation();
        playMechanicalSwitchClick();

        if (isBulkDownloading) {
            cancelBulkDownload = true;
        }

        var savedTitles = await getAllSavedTrackTitles();
        if (savedTitles.length === 0) {
            nowPlayingSubtitle.textContent = "OFFLINE STORAGE IS ALREADY EMPTY";
            setTimeout(syncTrackUI, 2000);
            return;
        }

        var confirmed = confirm(`Delete all ${savedTitles.length} cached songs from device storage?`);
        if (!confirmed) return;

        try {
            await clearAllStoredTracksFromDB();
            updateCacheButtonState(false);
            updateSavedCountDisplay();
            populatePlaylistDropdown();

            if (!activeFmKey && playlist[currentTrackIndex]) {
                var currentPos = hifiAudio.currentTime;
                var wasPaused = hifiAudio.paused;
                hifiAudio.src = playlist[currentTrackIndex].src;
                hifiAudio.currentTime = currentPos;
                if (!wasPaused) {
                    hifiAudio.play().catch(function(){});
                }
            }

            nowPlayingSubtitle.textContent = "CLEARED ALL OFFLINE CACHE (STORAGE FREED)";
            setTimeout(syncTrackUI, 2500);
        } catch (err) {
            nowPlayingSubtitle.textContent = "FAILED TO CLEAR STORAGE";
            setTimeout(syncTrackUI, 2000);
        }
    }

    /* --- VINTAGE TAPE & VINYL AUDIO GENERATORS --- */
    function makeTapeSaturationCurve(amount) {
        var k = typeof amount === 'number' ? amount : 25;
        var n_samples = 44100;
        var curve = new Float32Array(n_samples);
        var deg = Math.PI / 180;
        for (var i = 0; i < n_samples; ++i) {
            var x = (i * 2) / n_samples - 1;
            curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
            curve[i] = Math.tanh(curve[i] * 0.9);
        }
        return curve;
    }

    function createTapeHissBuffer(ctx) {
        var bufferSize = ctx.sampleRate * 3;
        var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        var data = buffer.getChannelData(0);
        var lastOut = 0.0;
        for (var i = 0; i < bufferSize; i++) {
            var white = Math.random() * 2 - 1;
            lastOut = (lastOut * 0.92) + (white * 0.08);
            data[i] = lastOut;
        }
        return buffer;
    }

    function setupTapeHissNode(ctx) {
        if (tapeHissSource) return;
        var hissBuffer = createTapeHissBuffer(ctx);
        tapeHissSource = ctx.createBufferSource();
        tapeHissSource.buffer = hissBuffer;
        tapeHissSource.loop = true;

        var hissHp = ctx.createBiquadFilter();
        hissHp.type = "highpass";
        hissHp.frequency.setValueAtTime(650, ctx.currentTime);

        var hissLp = ctx.createBiquadFilter();
        hissLp.type = "lowpass";
        hissLp.frequency.setValueAtTime(8500, ctx.currentTime);

        tapeHissGain = ctx.createGain();
        tapeHissGain.gain.setValueAtTime(0, ctx.currentTime);

        tapeHissSource.connect(hissHp);
        hissHp.connect(hissLp);
        hissLp.connect(tapeHissGain);
        tapeHissSource.start(0);
    }

    function setupWowFlutterNodes(ctx) {
        if (tapeDelayNode) return;
        tapeDelayNode = ctx.createDelay(0.1);
        tapeDelayNode.delayTime.setValueAtTime(0.020, ctx.currentTime);

        wowOsc = ctx.createOscillator();
        wowOsc.type = 'sine';
        wowOsc.frequency.setValueAtTime(0.75, ctx.currentTime);

        wowGain = ctx.createGain();
        wowGain.gain.setValueAtTime(0.00045, ctx.currentTime);

        flutterOsc = ctx.createOscillator();
        flutterOsc.type = 'triangle';
        flutterOsc.frequency.setValueAtTime(6.5, ctx.currentTime);

        flutterGain = ctx.createGain();
        flutterGain.gain.setValueAtTime(0.00015, ctx.currentTime);

        wowFlutterMasterGain = ctx.createGain();
        wowFlutterMasterGain.gain.setValueAtTime(mediaFormat === 'tape' ? 1.0 : 0.0, ctx.currentTime);

        wowOsc.connect(wowGain);
        flutterOsc.connect(flutterGain);
        wowGain.connect(wowFlutterMasterGain);
        flutterGain.connect(wowFlutterMasterGain);
        wowFlutterMasterGain.connect(tapeDelayNode.delayTime);

        wowOsc.start(0);
        flutterOsc.start(0);
    }

    function createVinylCrackleBuffer(ctx) {
        var length = ctx.sampleRate * 4;
        var buffer = ctx.createBuffer(1, length, ctx.sampleRate);
        var data = buffer.getChannelData(0);
        var lastOut = 0.0;

        for (var i = 0; i < length; i++) {
            var white = Math.random() * 2 - 1;
            lastOut = (lastOut * 0.96) + (white * 0.04);
            var sample = lastOut * 0.4;

            if (Math.random() < 0.00035) {
                sample += (Math.random() * 2 - 1) * 0.75;
            }
            if (Math.random() < 0.00004) {
                sample += (Math.random() > 0.5 ? 1 : -1) * 0.95;
            }
            data[i] = sample;
        }
        return buffer;
    }

    function setupVinylNodes(ctx) {
        if (vinylCrackleSource) return;
        var buffer = createVinylCrackleBuffer(ctx);
        vinylCrackleSource = ctx.createBufferSource();
        vinylCrackleSource.buffer = buffer;
        vinylCrackleSource.loop = true;

        vinylPhonoFilter = ctx.createBiquadFilter();
        vinylPhonoFilter.type = "lowpass";
        vinylPhonoFilter.frequency.setValueAtTime(10500, ctx.currentTime);

        vinylCrackleGain = ctx.createGain();
        vinylCrackleGain.gain.setValueAtTime(0, ctx.currentTime);

        vinylCrackleSource.connect(vinylPhonoFilter);
        vinylPhonoFilter.connect(vinylCrackleGain);
        vinylCrackleSource.start(0);
    }

    function updateFormatNoiseState() {
        if (!audioCtx) return;
        var isPlaying = !hifiAudio.paused && !activeFmKey;

        if (tapeHissGain) {
            var targetTapeGain = (isPlaying && mediaFormat === 'tape') ? 0.016 : 0.0;
            tapeHissGain.gain.setTargetAtTime(targetTapeGain, audioCtx.currentTime, 0.15);
        }

        if (vinylCrackleGain) {
            var targetVinylGain = (isPlaying && mediaFormat === 'vinyl') ? 0.022 : 0.0;
            vinylCrackleGain.gain.setTargetAtTime(targetVinylGain, audioCtx.currentTime, 0.15);
        }

        if (wowFlutterMasterGain) {
            var targetWow = (mediaFormat === 'tape') ? 1.0 : (mediaFormat === 'vinyl' ? 0.35 : 0.0);
            wowFlutterMasterGain.gain.setTargetAtTime(targetWow, audioCtx.currentTime, 0.05);
        }

        if (tapeSaturationNode) {
            var satAmount = (mediaFormat === 'tape') ? 18 : (mediaFormat === 'vinyl' ? 10 : 0);
            tapeSaturationNode.curve = makeTapeSaturationCurve(satAmount);
        }
    }

    /* --- MECHANICAL SOUND EFFECTS & CUES --- */
    function playTapeTransportEngage() {
        if (!audioCtx) return;
        var now = audioCtx.currentTime;

        var oscSolenoid = audioCtx.createOscillator();
        var gainSolenoid = audioCtx.createGain();
        oscSolenoid.type = 'triangle';
        oscSolenoid.frequency.setValueAtTime(110, now);
        oscSolenoid.frequency.exponentialRampToValueAtTime(32, now + 0.08);

        gainSolenoid.gain.setValueAtTime(0.55, now);
        gainSolenoid.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

        oscSolenoid.connect(gainSolenoid);
        gainSolenoid.connect(audioCtx.destination);
        oscSolenoid.start(now);
        oscSolenoid.stop(now + 0.1);

        var snapBuffer = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * 0.04), audioCtx.sampleRate);
        var snapData = snapBuffer.getChannelData(0);
        for (var i = 0; i < snapData.length; i++) {
            snapData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (snapBuffer.length * 0.25));
        }

        var snapSource = audioCtx.createBufferSource();
        snapSource.buffer = snapBuffer;

        var snapFilter = audioCtx.createBiquadFilter();
        snapFilter.type = 'bandpass';
        snapFilter.frequency.setValueAtTime(2400, now);
        snapFilter.Q.setValueAtTime(3.5, now);

        var snapGain = audioCtx.createGain();
        snapGain.gain.setValueAtTime(0.35, now + 0.02);
        snapGain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

        snapSource.connect(snapFilter);
        snapFilter.connect(snapGain);
        snapGain.connect(audioCtx.destination);
        snapSource.start(now + 0.02);
    }

    function playTapeTransportRelease() {
        if (!audioCtx) return;
        var now = audioCtx.currentTime;

        var oscSpring = audioCtx.createOscillator();
        var gainSpring = audioCtx.createGain();
        oscSpring.type = 'square';
        oscSpring.frequency.setValueAtTime(1800, now);
        oscSpring.frequency.exponentialRampToValueAtTime(300, now + 0.035);

        gainSpring.gain.setValueAtTime(0.25, now);
        gainSpring.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

        oscSpring.connect(gainSpring);
        gainSpring.connect(audioCtx.destination);
        oscSpring.start(now);
        oscSpring.stop(now + 0.05);

        var oscBody = audioCtx.createOscillator();
        var gainBody = audioCtx.createGain();
        oscBody.type = 'sine';
        oscBody.frequency.setValueAtTime(95, now + 0.015);
        oscBody.frequency.exponentialRampToValueAtTime(45, now + 0.07);

        gainBody.gain.setValueAtTime(0.4, now + 0.015);
        gainBody.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

        oscBody.connect(gainBody);
        gainBody.connect(audioCtx.destination);
        oscBody.start(now + 0.015);
        oscBody.stop(now + 0.09);
    }

    function playNeedleDropSound() {
        if (!audioCtx) return;
        var now = audioCtx.currentTime;

        var oscDrop = audioCtx.createOscillator();
        var gainDrop = audioCtx.createGain();
        oscDrop.type = 'triangle';
        oscDrop.frequency.setValueAtTime(80, now);
        oscDrop.frequency.exponentialRampToValueAtTime(28, now + 0.12);

        gainDrop.gain.setValueAtTime(0.45, now);
        gainDrop.gain.exponentialRampToValueAtTime(0.001, now + 0.13);

        oscDrop.connect(gainDrop);
        gainDrop.connect(audioCtx.destination);
        oscDrop.start(now);
        oscDrop.stop(now + 0.14);

        var scratchBuffer = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * 0.15), audioCtx.sampleRate);
        var scratchData = scratchBuffer.getChannelData(0);
        for (var i = 0; i < scratchData.length; i++) {
            scratchData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (scratchBuffer.length * 0.4));
        }

        var scratchSource = audioCtx.createBufferSource();
        scratchSource.buffer = scratchBuffer;

        var scratchFilter = audioCtx.createBiquadFilter();
        scratchFilter.type = 'bandpass';
        scratchFilter.frequency.setValueAtTime(1400, now + 0.04);
        scratchFilter.Q.setValueAtTime(2.0, now + 0.04);

        var scratchGain = audioCtx.createGain();
        scratchGain.gain.setValueAtTime(0.3, now + 0.04);
        scratchGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

        scratchSource.connect(scratchFilter);
        scratchFilter.connect(scratchGain);
        scratchGain.connect(audioCtx.destination);
        scratchSource.start(now + 0.04);

    function playMechanicalSwitchClick() {
        if (!audioCtx) return;

    /* --- WEB AUDIO GRAPH INITIALIZER --- */
    function initRealAudioContext() {
        if (!audioCtx) {
            try {
                var AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();

                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 64;

                analyserL = audioCtx.createAnalyser();
                analyserL.fftSize = 256;
                analyserL.smoothingTimeConstant = 0.8;

                analyserR = audioCtx.createAnalyser();
                analyserR.fftSize = 256;
                analyserR.smoothingTimeConstant = 0.8;

                channelSplitter = audioCtx.createChannelSplitter(2);

                bassFilter = audioCtx.createBiquadFilter();
                bassFilter.type = "lowshelf";
                bassFilter.frequency.setValueAtTime(150, audioCtx.currentTime);
                bassFilter.gain.setValueAtTime(currentBassGain, audioCtx.currentTime);

                trebleFilter = audioCtx.createBiquadFilter();
                trebleFilter.type = "highshelf";
                trebleFilter.frequency.setValueAtTime(3500, audioCtx.currentTime);
                trebleFilter.gain.setValueAtTime(currentTrebleGain, audioCtx.currentTime);

                tapeSaturationNode = audioCtx.createWaveShaper();
                tapeSaturationNode.curve = makeTapeSaturationCurve(mediaFormat === 'tape' ? 18 : (mediaFormat === 'vinyl' ? 10 : 0));
                tapeSaturationNode.oversample = '4x';

                setupWowFlutterNodes(audioCtx);
                setupTapeHissNode(audioCtx);
                setupVinylNodes(audioCtx);

                if (audioCtx.createStereoPanner) {
                    stereoPanner = audioCtx.createStereoPanner();
                    stereoPanner.pan.setValueAtTime(currentPan, audioCtx.currentTime);
                }

                compressor = audioCtx.createDynamicsCompressor();
                compressor.threshold.setValueAtTime(-18, audioCtx.currentTime);
                compressor.knee.setValueAtTime(12, audioCtx.currentTime);
                compressor.ratio.setValueAtTime(12, audioCtx.currentTime);
                compressor.attack.setValueAtTime(0.003, audioCtx.currentTime);
                compressor.release.setValueAtTime(0.25, audioCtx.currentTime);

                gainNode = audioCtx.createGain();

                if (!audioSourceConnected) {
                    var source = audioCtx.createMediaElementSource(hifiAudio);

                    source.connect(analyser);
                    analyser.connect(bassFilter);
                    bassFilter.connect(trebleFilter);
                    trebleFilter.connect(tapeSaturationNode);
                    tapeSaturationNode.connect(tapeDelayNode);

                    var pannedOutput = tapeDelayNode;
                    if (stereoPanner) {
                        tapeDelayNode.connect(stereoPanner);
                        pannedOutput = stereoPanner;
                    }

                    pannedOutput.connect(channelSplitter);
                    channelSplitter.connect(analyserL, 0);
                    channelSplitter.connect(analyserR, 1);

                    tapeHissGain.connect(compressor);
                    vinylCrackleGain.connect(compressor);

                    pannedOutput.connect(compressor);
                    compressor.connect(gainNode);
                    gainNode.connect(audioCtx.destination);

                    audioSourceConnected = true;
                }
            } catch(e) {}
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume().catch(()=>{});
        }
        updateFormatNoiseState();
    }

    /* --- ROTARY KNOB CONTROLS --- */
    function setupKnobControl(knobEl, onValueChange, minVal, maxVal, defaultVal) {
        if (!knobEl) return;
        var isDragging = false;
        var startY = 0;

        function updateVisualAngle(val) {
            var norm = (val - minVal) / (maxVal - minVal);
            var angle = -135 + norm * 270;
            knobEl.style.transform = 'rotate(' + angle + 'deg)';
            knobEl.setAttribute('data-val', val);
        }

        knobEl.addEventListener('pointerdown', function(e) {
            initRealAudioContext();
            isDragging = true;
            startY = e.clientY;
            knobEl.setPointerCapture(e.pointerId);
            e.preventDefault();
        });

        knobEl.addEventListener('pointermove', function(e) {
            if (!isDragging) return;
            var deltaY = startY - e.clientY;
            startY = e.clientY;

            var currentVal = parseFloat(knobEl.getAttribute('data-val') || defaultVal);
            var step = (maxVal - minVal) / 100;
            var newVal = Math.min(maxVal, Math.max(minVal, currentVal + deltaY * step));

            updateVisualAngle(newVal);
            onValueChange(newVal);
        });

        knobEl.addEventListener('pointerup', function(e) {
            isDragging = false;
            knobEl.releasePointerCapture(e.pointerId);
        });

        updateVisualAngle(defaultVal);
        return updateVisualAngle;
    }

    function applyVolumeGain() {
        var val = parseFloat(volumeSlider.value);
        if (isNaN(val)) val = 1.0;

        hifiAudio.volume = Math.min(1.0, Math.max(0.0, val > 0 ? 1.0 : 0.0));

        if (gainNode && audioCtx) {
            gainNode.gain.setTargetAtTime(val, audioCtx.currentTime, 0.015);
            if (compressor) {
                var adaptiveThreshold = val > 1.5 ? -18 - ((val - 1.5) * 2.5) : -14;
                compressor.threshold.setTargetAtTime(adaptiveThreshold, audioCtx.currentTime, 0.05);
            }
        }

        boostText.textContent = val.toFixed(1) + "x";
        if (typeof updateVolumeKnobAngle === 'function') {
            updateVolumeKnobAngle(val);
        }
    }

        else if (val < 5.0) volumeSlider.value = 5.0;
        else volumeSlider.value = 1.0;
        applyVolumeGain();
    }
