                neonBadgeGroup.style.filter = 
                    'drop-shadow(0 0 ' + cyanRadius + 'px rgba(0, 229, 255, ' + (0.3 + badgeBassEnergy * 0.7).toFixed(2) + ')) ' +
                    'drop-shadow(0 0 ' + amberRadius + 'px rgba(255, 170, 0, ' + (0.2 + badgeBassEnergy * 0.8).toFixed(2) + '))';
                neonBadgeGroup.style.opacity = opacityVal;

                var notes = neonBadgeGroup.querySelectorAll('.neon-note, .neon-note-bottom');
                var noteColor = badgeBassEnergy > 0.65 ? '#ffffff' : (badgeBassEnergy > 0.4 ? '#00e5ff' : '#ffaa00');
                notes.forEach(function(note) {
                    note.setAttribute('fill', noteColor);
                });
            }

            for (var i = 0; i < numBars; i++) {
                var val = dataArray[i] || 0;
                var targetHeight = Math.max(4, (val / 255) * (canvas.height - 10));

                if (!capHeights[i] || targetHeight > capHeights[i]) {
                    capHeights[i] = targetHeight;
                } else {
                    capHeights[i] -= 0.8;
                }

                var x = startX + i * (barWidth + gap);
                var gradient = canvasCtx.createLinearGradient(0, canvas.height, 0, 0);
                gradient.addColorStop(0, '#ff4b1f');
                gradient.addColorStop(0.6, '#ffaa00');
                gradient.addColorStop(1, '#00e5ff');

                canvasCtx.fillStyle = gradient;
                canvasCtx.fillRect(x, canvas.height - targetHeight - 2, barWidth, targetHeight);

                canvasCtx.fillStyle = '#ffffff';
                canvasCtx.beginPath();
                canvasCtx.arc(x + barWidth / 2, canvas.height - capHeights[i] - 5, 2, 0, Math.PI * 2);
                canvasCtx.fill();
            }
        } else {
            if (neonBadgeGroup) {
                neonBadgeGroup.style.filter = 'drop-shadow(0 0 2px rgba(0, 229, 255, 0.3))';
                neonBadgeGroup.style.opacity = '0.7';
                var idleNotes = neonBadgeGroup.querySelectorAll('.neon-note, .neon-note-bottom');
                idleNotes.forEach(function(note) { note.setAttribute('fill', '#ffaa00'); });
            }

            for (var j = 0; j < numBars; j++) {
                var idleX = startX + j * (barWidth + gap);
                canvasCtx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                canvasCtx.fillRect(idleX, canvas.height - 6, barWidth, 3);
            }
        }
    }

    function destroyHls() {
        if (hls) {
            hls.destroy();
            hls = null;
        }
    }

    function playFmStation(key, evt) {
        if (!fmStations[key]) return;
        activeFmKey = key;
        hifiAudio.pause();
        destroyHls();
        clearLoadGuard();
        playMechanicalSwitchClick();

        document.querySelectorAll('.fm-preset-btn').forEach(btn => btn.classList.remove('active-fm'));
        if (evt && evt.currentTarget) {
            evt.currentTarget.classList.add('active-fm');
        } else {
            var matchedBtn = Array.from(document.querySelectorAll('.fm-preset-btn')).find(b => b.textContent.includes(key.toUpperCase()));
            if (matchedBtn) matchedBtn.classList.add('active-fm');
        }

        var stationInfo = fmStations[key];
        currentFmFrequency = stationInfo.freq;
        if (fmFreqVal) fmFreqVal.textContent = stationInfo.freq.toFixed(1) + " MHz";
        var percent = Math.min(100, Math.max(0, ((stationInfo.freq - 88.0) / 20.0) * 100));
        if (fmTuningNeedle) fmTuningNeedle.style.left = percent.toFixed(1) + "%";
        if (fmStereoBeacon) fmStereoBeacon.classList.add('tuned');
        if (fmStationCallsign) fmStationCallsign.textContent = stationInfo.query.toUpperCase();

        nowPlayingSubtitle.textContent = "TUNING STREAM...";
        currentTrackTitle.textContent = stationInfo.title;
        currentTimeSpan.textContent = "0:00";
        durationSpan.textContent = "LIVE";
        progressSlider.value = 0;

        if (nextTrackTitle) {
            nextTrackTitle.textContent = "FM LIVE BROADCAST (NO QUEUE)";
        }

        if (stationInfo.useApi) {
            fetch("https://de1.api.radio-browser.info/json/stations/byname/" + encodeURIComponent(stationInfo.query))
                .then(res => res.json())
                .then(data => {
                    if (activeFmKey !== key) return;
                    var resolvedUrl = (data && data.length > 0 && data[0].url_resolved) ? data[0].url_resolved : stationInfo.backup;
                    startStreamUrl(stationInfo.title, resolvedUrl);
                })
                .catch(() => {
                    if (activeFmKey !== key) return;
                    startStreamUrl(stationInfo.title, stationInfo.backup);
                });
        } else {
            startStreamUrl(stationInfo.title, stationInfo.backup);
        }
    }

    function startStreamUrl(title, url) {
        destroyHls();
        currentStreamUrl = url;
        currentTrackTitle.textContent = title;

        if (url.includes('.m3u8')) {
            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(hifiAudio);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    nowPlayingSubtitle.textContent = "LIVE FM RADIO";
                    hifiAudio.play().catch(() => {});
                });
            } else if (hifiAudio.canPlayType('application/vnd.apple.mpegurl')) {
                hifiAudio.src = url;
                hifiAudio.load();
                hifiAudio.play().catch(() => {});
            }
        } else {
            hifiAudio.src = url;
            hifiAudio.load();
            hifiAudio.play().catch(() => {});
        }
        updateMediaSession();
    }

    function turnOffRadio() {
        activeFmKey = null;
        currentStreamUrl = null;
        destroyHls();
        playMechanicalSwitchClick();
        if (fmStaticGain && audioCtx) fmStaticGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
        if (fmStereoBeacon) fmStereoBeacon.classList.remove('tuned');
        if (fmStationCallsign) fmStationCallsign.textContent = "OFF";
        document.querySelectorAll('.fm-preset-btn').forEach(btn => btn.classList.remove('active-fm'));
        hifiAudio.pause();
        loadTrack(currentTrackIndex, true);
    }

    function exitApp() {
        destroyHls();
        if (hifiAudio) hifiAudio.pause();
        if (wakeLock) wakeLock.release().catch(()=>{});
        try { window.close(); } catch(e) {}
        setTimeout(() => { window.location.href = "about:blank"; }, 300);
    }

    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator && (!wakeLock || wakeLock.released)) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch (err) {}
    }

    async function handleLocalFiles(event) {
        var files = event.target.files;
        if (!files || files.length === 0) return;

        activeFmKey = null;
        destroyHls();
        document.querySelectorAll('.fm-preset-btn').forEach(btn => btn.classList.remove('active-fm'));

        nowPlayingSubtitle.textContent = "IMPORTING & SAVING LOCAL TRACKS...";

        var addedCount = 0;
        var firstAddedIndex = -1;

        for (var j = 0; j < files.length; j++) {
            var file = files[j];
            if (file.type.startsWith('audio/') || file.name.match(/\.(mp3|wav|ogg|m4a|aac|flac)$/i)) {
                var cleanTitle = file.name.replace(/\.[^/.]+$/, "");
                
                try {
                    await saveTrackToDB(cleanTitle, file);
                } catch (e) {
                    console.warn("Could not save to DB:", cleanTitle, e);
                }

                var existsIndex = playlist.findIndex(t => t.title.toLowerCase() === cleanTitle.toLowerCase());
                if (existsIndex === -1) {
                    var objectUrl = URL.createObjectURL(file);
                    playlist.push({
                        title: cleanTitle,
                        src: objectUrl,
                        isLocalImported: true
                    });
                    if (firstAddedIndex === -1) {
                        firstAddedIndex = playlist.length - 1;
                    }
                    addedCount++;
                } else if (firstAddedIndex === -1) {
                    firstAddedIndex = existsIndex;
                }
            }
        }

        playlist.sort((a, b) => a.title.localeCompare(b.title, undefined, { sensitivity: 'base' }));

        if (firstAddedIndex !== -1) {
            var targetTitle = (files[0].name.replace(/\.[^/.]+$/, ""));
            var sortedIdx = playlist.findIndex(t => t.title === targetTitle);
            if (sortedIdx !== -1) firstAddedIndex = sortedIdx;
        }

        event.target.value = '';

        updateSavedCountDisplay();
        populatePlaylistDropdown();

        if (firstAddedIndex !== -1) {
            togglePlaylistDropdown();
            loadTrack(firstAddedIndex, true);
        }

        nowPlayingSubtitle.textContent = `IMPORTED ${addedCount} TRACKS TO PLAYLIST!`;
        setTimeout(syncTrackUI, 2500);
    }

    function restoreSavedTracksIntoPlaylist() {
        return openOfflineDB().then(function(db) {
            return new Promise(function(resolve) {
                var tx = db.transaction(STORE_NAME, 'readonly');
                var store = tx.objectStore(STORE_NAME);
                var req = store.openCursor();

                req.onsuccess = function(e) {
                    var cursor = e.target.result;
                    if (cursor) {
                        var record = cursor.value;
                        if (record && record.title && record.blob) {
                            var exists = playlist.some(t => t.title.toLowerCase() === record.title.toLowerCase());
                            if (!exists) {
                                playlist.push({
                                    title: record.title,
                                    src: URL.createObjectURL(record.blob),
                                    isLocalImported: true
                                });
                            }
                        }
                        cursor.continue();
                    } else {
                        playlist.sort((a, b) => a.title.localeCompare(b.title, undefined, { sensitivity: 'base' }));
                        resolve();
                    }
                };

                req.onerror = function() {
                    resolve();
                };
            });
        });
    }

    function updateMediaSession() {
        if ('mediaSession' in navigator) {
            var activeTitle = activeFmKey 
                ? fmStations[activeFmKey].title 
                : (playlist[currentTrackIndex] ? playlist[currentTrackIndex].title : "Track");

            navigator.mediaSession.metadata = new MediaMetadata({
                title: activeTitle,
                artist: "Chanthiran Mini HiFi",
                album: activeFmKey ? "FM Tuner" : (mediaFormat === 'vinyl' ? "Vinyl LP" : "Cassette BGM")
            });
            navigator.mediaSession.playbackState = hifiAudio.paused ? "paused" : "playing";

            navigator.mediaSession.setActionHandler('play', () => togglePlayPause());
            navigator.mediaSession.setActionHandler('pause', () => togglePlayPause());
            navigator.mediaSession.setActionHandler('previoustrack', () => playPrevious());
            navigator.mediaSession.setActionHandler('nexttrack', () => playNext());
        }
    }

    function formatTime(seconds) {
        var min = Math.floor(seconds / 60);
        var sec = Math.floor(seconds % 60);
        return min + ':' + (sec < 10 ? '0' + sec : sec);
    }

    function populatePlaylistDropdown() {
        dropdownTrackList.innerHTML = '';
        updateSavedCountDisplay();

        getAllSavedTrackTitles().then(function(savedTitles) {
            var savedSet = new Set(savedTitles);

            var tracksToDisplay = playlist.map(function(track, originalIdx) {
                return { 
                    track: track, 
                    originalIdx: originalIdx, 
                    isSaved: savedSet.has(track.title) 
                };
            });

            if (currentPlaylistTab === 'offline') {
                tracksToDisplay = tracksToDisplay.filter(function(item) {
                    return item.isSaved;
                });
            }

            if (searchFilterText) {
                tracksToDisplay = tracksToDisplay.filter(function(item) {
                    return item.track.title.toLowerCase().includes(searchFilterText);
                });
            }

            if (tracksToDisplay.length === 0) {
                var emptyMsg = document.createElement('div');
                emptyMsg.className = 'empty-offline-notice';
                if (searchFilterText) {
                    emptyMsg.innerHTML = `NO SONGS FOUND MATCHING:<br>"<span style="color:#ffaa00;">${searchFilterText}</span>"`;
                } else if (currentPlaylistTab === 'offline') {
                    emptyMsg.innerHTML = "NO SAVED TRACKS YET.<br>PICK LOCAL FILES OR SAVE SONGS FOR OFFLINE PLAYBACK.";
                }
                dropdownTrackList.appendChild(emptyMsg);
                return;
            }

            tracksToDisplay.forEach(function(item) {
                var a = document.createElement('a');
                a.href = '#';
                a.setAttribute('data-index', item.originalIdx);
                
                var badgeHtml = item.isSaved ? '<span class="offline-item-badge">💾 SAVED</span>' : '';
                
                var displayTitle = item.track.title;
                if (searchFilterText) {
                    var regex = new RegExp(`(${searchFilterText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                    displayTitle = displayTitle.replace(regex, '<span style="color:#00e5ff; text-decoration:underline;">$1</span>');
                }

                a.innerHTML = `<span>${displayTitle}</span>${badgeHtml}`;

                a.onclick = function(e) { 
                    e.preventDefault(); 
                    activeFmKey = null;
                    destroyHls();
                    document.querySelectorAll('.fm-preset-btn').forEach(btn => btn.classList.remove('active-fm'));
                    loadTrack(item.originalIdx, true); 
                    togglePlaylistDropdown(); 
                };

                dropdownTrackList.appendChild(a);
            });

            updateActiveTrackHighlight();
        });
    }

    function updateActiveTrackHighlight() {
        Array.from(dropdownTrackList.children).forEach(function(item) {
            if (item.hasAttribute('data-index')) {
                var idx = parseInt(item.getAttribute('data-index'), 10);
                item.classList.toggle('active', !activeFmKey && idx === currentTrackIndex);
            }
        });
    }

    function toggleShuffle() {
        isShuffle = !isShuffle;
        shuffleButton.classList.toggle('active-mode', isShuffle);
        playMechanicalSwitchClick();
        nextUpcomingIndex = -1;
        scheduleNextTrackPreload();
    }

    function getRandomIndex() {
        if (playlist.length <= 1) return 0;
        var randomIndex;
        do {
            randomIndex = Math.floor(Math.random() * playlist.length);
        } while (randomIndex === currentTrackIndex);
        return randomIndex;
    }

    function restartTrack() {
        if (activeFmKey) {
            playFmStation(activeFmKey);
            return;
        }
        playMechanicalSwitchClick();
        hifiAudio.currentTime = 0;
        hifiAudio.play().catch(()=>{});
    }

    function syncTrackUI() {
        hasUserStartedPlayback = true;
        if (activeFmKey) {
            nowPlayingSubtitle.textContent = "LIVE FM RADIO";
            currentTrackTitle.textContent = fmStations[activeFmKey].title;
            if (nextTrackTitle) nextTrackTitle.textContent = "FM LIVE BROADCAST (NO QUEUE)";
        } else {
            var title = playlist[currentTrackIndex] ? playlist[currentTrackIndex].title : "Track";
            nowPlayingSubtitle.textContent = "NOW PLAYING";
            currentTrackTitle.textContent = title;
            updateUpcomingTrackUI();
        }
        updateActiveTrackHighlight();
        updateMediaSession();
    }

    function determineNextIndex() {
        if (playlist.length <= 1) return 0;
        return isShuffle ? getRandomIndex() : (currentTrackIndex + 1) % playlist.length;
    }

    function updateUpcomingTrackUI() {
        if (!nextTrackTitle) return;
        if (activeFmKey) {
            nextTrackTitle.textContent = "FM LIVE BROADCAST (NO QUEUE)";
            return;
        }
        if (playlist.length <= 1) {
            nextTrackTitle.textContent = "SINGLE TRACK LOOP";
            return;
        }
        if (nextUpcomingIndex < 0 || nextUpcomingIndex >= playlist.length) {
            nextUpcomingIndex = determineNextIndex();
        }
        var nextSong = playlist[nextUpcomingIndex];
        nextTrackTitle.textContent = nextSong ? nextSong.title : "None";
    }

    async function scheduleNextTrackPreload() {
        if (playlist.length <= 1 || activeFmKey) return;

        if (nextUpcomingIndex < 0 || nextUpcomingIndex === currentTrackIndex) {
            nextUpcomingIndex = determineNextIndex();
        }

        var candidateTrack = playlist[nextUpcomingIndex];
        if (!candidateTrack) return;

        updateUpcomingTrackUI();

        if (candidateTrack.title === preloadedTrackTitle) return;
        preloadedTrackTitle = candidateTrack.title;

        var cachedBlob = await getTrackFromDB(candidateTrack.title);
        if (cachedBlob) {
            if (preloadedBlobUrl) URL.revokeObjectURL(preloadedBlobUrl);
            preloadedBlobUrl = URL.createObjectURL(cachedBlob);
            preloaderAudio.src = preloadedBlobUrl;
        } else {
            preloaderAudio.src = candidateTrack.src;
        }

        preloaderAudio.load();
    }

    function loadTrack(index, autoPlay = true) {
        if (playlist.length === 0) return;
        activeFmKey = null;
        destroyHls();
        clearLoadGuard();
        currentTrackIndex = index;
        isTransitioning = true;
        nextUpcomingIndex = -1;

        var targetTrack = playlist[currentTrackIndex];
        initRealAudioContext();
        if (autoPlay) triggerFormatCueSound();

        hifiAudio.pause();

        if (preloadedTrackTitle === targetTrack.title && preloaderAudio.src) {
            hifiAudio.src = preloaderAudio.src;
            hifiAudio.load();
            syncTrackUI();

            if (autoPlay) {
                var playPromise = hifiAudio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isTransitioning = false;
                        requestWakeLock();
                    }).catch(() => {
                        setTimeout(() => hifiAudio.play().catch(()=>{}), 200);
                    });
                }
            } else {
                isTransitioning = false;
            }

            setTimeout(scheduleNextTrackPreload, 1000);
            return;
        }

        getTrackFromDB(targetTrack.title).then(function(cachedBlob) {
            if (cachedBlob) {
                hifiAudio.src = URL.createObjectURL(cachedBlob);
                updateCacheButtonState(true);
            } else {
                hifiAudio.src = targetTrack.src;
                updateCacheButtonState(false);
            }

            hifiAudio.load();
            syncTrackUI();

            if (autoPlay) {
                var playPromise = hifiAudio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isTransitioning = false;
                        requestWakeLock();
                    }).catch(() => {
                        setTimeout(() => hifiAudio.play().catch(()=>{}), 250);
                    });
                }
            } else {
                isTransitioning = false;
            }

            setTimeout(scheduleNextTrackPreload, 1500);
        });
    }

    function togglePlayPause() {
        initRealAudioContext();
        if (hifiAudio.paused) { 
            triggerFormatCueSound();
            hifiAudio.play().catch(()=>{});
        } else { 
            playTapeTransportRelease();
            hifiAudio.pause(); 
        }
    }

    function playNext() {
        clearLoadGuard();
        if (activeFmKey) return;
        playMechanicalSwitchClick();

        if (playlist.length === 0) return;
        var targetIndex = (nextUpcomingIndex >= 0 && nextUpcomingIndex < playlist.length) 
            ? nextUpcomingIndex 
            : determineNextIndex();

        loadTrack(targetIndex, true);
    }

    function playPrevious() {
        clearLoadGuard();
        if (activeFmKey) return;
        playMechanicalSwitchClick();

        if (playlist.length === 0) return;
        var prevIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
        loadTrack(prevIndex, true);
    }

    function togglePlaylistDropdown() { 
        playlistDropdown.parentElement.classList.toggle('show'); 
        playMechanicalSwitchClick();
    }

    hifiAudio.addEventListener('ended', function() {
        if (playlist.length > 0 && !isTransitioning) {
            isTransitioning = true;
            playNext();
        }
    });

    hifiAudio.addEventListener('error', function() {
        clearLoadGuard();
        if (hifiAudio.error && hifiAudio.error.code === 20) return;

        consecutiveErrorCount++;
        if (consecutiveErrorCount > 3) {
            nowPlayingSubtitle.textContent = "PLAYBACK PAUSED: NETWORK UNSTABLE";
            isTransitioning = false;
            return;
        }

        nowPlayingSubtitle.textContent = "RETRYING / ADVANCING TRACK...";
        setTimeout(() => {
            playNext();
        }, 1200);
    });

    hifiAudio.addEventListener('waiting', function() {
        clearLoadGuard();
        loadTimeout = setTimeout(function() {
            if (hifiAudio.readyState < 2 && !hifiAudio.paused && !isTransitioning) {
                isTransitioning = true;
                playNext();
            }
        }, 12000);
    });

    hifiAudio.addEventListener('playing', () => {
        clearLoadGuard();
        isTransitioning = false;
        consecutiveErrorCount = 0;
        preloadTriggeredForCurrentTrack = false;
        syncTrackUI();
        initRealAudioContext();
        updateFormatNoiseState();
        playButton.style.display = 'none'; 
        pauseButton.style.display = 'inline-flex'; 
        syncDeckVisuals();
    });

    hifiAudio.addEventListener('pause', () => { 
        if (hifiAudio.paused) {
            updateFormatNoiseState();
            playButton.style.display = 'inline-flex'; 
            pauseButton.style.display = 'none'; 
            syncDeckVisuals();
            updateMediaSession();
        }
    });

    hifiAudio.addEventListener('timeupdate', () => {
        if (!activeFmKey && !isNaN(hifiAudio.duration) && hifiAudio.duration > 0) {
            progressSlider.value = hifiAudio.currentTime;
            currentTimeSpan.textContent = formatTime(hifiAudio.currentTime);
            updateTapeCounter(hifiAudio.currentTime);
            syncDeckVisuals();

            if (!preloadTriggeredForCurrentTrack && (hifiAudio.currentTime > 15 || hifiAudio.currentTime > hifiAudio.duration * 0.5)) {
                preloadTriggeredForCurrentTrack = true;
                scheduleNextTrackPreload();
            }
        }
    });

    hifiAudio.addEventListener('loadedmetadata', () => {
        if (!activeFmKey && !isNaN(hifiAudio.duration)) {
            progressSlider.max = hifiAudio.duration;
            durationSpan.textContent = formatTime(hifiAudio.duration);
        }
        syncTrackUI();
    });

    volumeSlider.addEventListener('input', () => applyVolumeGain());

    progressSlider.addEventListener('input', () => { 
        if (!activeFmKey) {
            hifiAudio.currentTime = progressSlider.value;
            updateTapeCounter(hifiAudio.currentTime);
            syncDeckVisuals();
        }
    });

    window.onclick = function(event) {
        if (!event.target.closest('.music-button') && 
            !event.target.matches('.pl-text') && 
            !event.target.closest('.dropdown-content')) {
            document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
        }
    };

    var cassetteWellEl = document.querySelector('.cassette-deck-well');
    if (cassetteWellEl) {
        cassetteWellEl.addEventListener('click', function(e) {
            if (e.target.closest('.deck-eject-btn') || e.target.closest('.counter-reset-btn')) return;
            initRealAudioContext();
            playMechanicalSwitchClick();
        });
    }

    async function initPlayer() {
        await restoreSavedTracksIntoPlaylist();
        populatePlaylistDropdown();
        loadSavedPresetSlots();
        animateVUMeters();
        renderVisualizer();
        loadTrack(Math.floor(Math.random() * playlist.length), false);
        applyVolumeGain();
        updateNetworkStatus();
        updateSavedCountDisplay();
        updateKnobLevelGauge('gaugeBass', 0.5, true, '#00e5ff');
        updateKnobLevelGauge('gaugeTreble', 0.5, true, '#00e5ff');
        updateKnobLevelGauge('gaugeBalance', 0.5, true, '#ffaa00');
        updateKnobLevelGauge('gaugeVolume', 0.2, false, '#00e5ff');
        updateFmDialFromFrequency(96.3);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initPlayer);
    } else {
        initPlayer();
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('sw.js').catch(function() {});
        });
    }
</script>
